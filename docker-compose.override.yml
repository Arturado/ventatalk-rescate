services:
  postgres:
    image: postgres:16-alpine
    container_name: rescate-postgres
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ventatalk_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rescate-api:
    depends_on:
      postgres:
        condition: service_healthy

networks:
  ventatalk-rescate_default:
    external: false
  ventatalk_default:
    external: false

volumes:
  pgdata:
