version: "3.8"
services:
  rescate-api:
    build: .
    container_name: rescate-api
    restart: always
    ports:
      - "8010:8010"
    env_file: .env
    environment:
      - TZ=America/Caracas
      - HELP_DATA_ENCRYPTION_KEY_V1=${HELP_DATA_ENCRYPTION_KEY_V1:-}
      - HELP_DATA_ACTIVE_KEY_VERSION=${HELP_DATA_ACTIVE_KEY_VERSION:-}
      - HELP_IDENTITY_HASH_KEY=${HELP_IDENTITY_HASH_KEY:-}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ventatalk-rescate_default
      - ventatalk_default

networks:
  ventatalk-rescate_default:
    external: true
  ventatalk_default:
    external: true
