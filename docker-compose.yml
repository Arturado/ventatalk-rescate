version: "3.8"

services:
  rescate-api:
    build: .
    container_name: rescate-api
    restart: always
    ports:
      - "8010:8010"
    env_file: .env
    environment:
      - TZ=America/Caracas
    volumes:
      - ./uploads:/app/uploads
      - ./rescate.db:/app/rescate.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
