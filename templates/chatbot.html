    #cb-file-label {

    }

    #cb-file-preview { font-size: 13px; color: #16a34a; text-align: center; }

    /* SUCCESS */

    .cb-success-icon { font-size: 64px; }
    .cb-success h2 { font-size: 22px; color: #16a34a; font-weight: 800; }
    .cb-success h4 { font-size: 20px; color: #16a34a; font-weight: 800; }
    .cb-success p { font-size: 15px; color: #6b7280; line-height: 1.65; max-width: 320px; }

      body { align-items: center; background: #f0f0f0; }

    }
    .cb-btn-fallecido:hover { border-color: #9ca3af; color: #374151; }
  </style>

<!-- CAMBIO 3: IndexedDB — dos stores (draft + queue) -->
<script>
const DB_NAME = 'vrescate-queue';
const DB_VERSION = 2;
const STORE_PENDING = 'reportes_pendientes';
const STORE_DRAFT = 'reporte_draft';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_PENDING))
        db.createObjectStore(STORE_PENDING, { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains(STORE_DRAFT))
        db.createObjectStore(STORE_DRAFT, { keyPath: 'key' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

// ── Draft (progreso paso a paso) ──────────────────────────────

async function saveDraft(stepIndex, formDataObj) {
  const db = await openDB();
  const serializable = { ...formDataObj };
  for (const key of ['foto', 'foto_2', 'foto_3']) {
    if (serializable[key] instanceof File) {
      serializable[key + '_b64'] = await fileToBase64(serializable[key]);
      serializable[key + '_name'] = serializable[key].name;
      delete serializable[key];
    }
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_DRAFT, 'readwrite');
    tx.objectStore(STORE_DRAFT).put({
      key: 'current',
      stepIndex,
      formData: serializable,
      savedAt: new Date().toISOString()
    });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function getDraft() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_DRAFT, 'readonly');
    const req = tx.objectStore(STORE_DRAFT).get('current');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function clearDraft() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_DRAFT, 'readwrite');
    tx.objectStore(STORE_DRAFT).delete('current');
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ── Queue (reportes completos pendientes de envío) ────────────

async function saveToQueue(formDataObj) {
  const db = await openDB();
  const serializable = { ...formDataObj };
  for (const key of ['foto', 'foto_2', 'foto_3']) {
    if (serializable[key] instanceof File) {
      serializable[key + '_b64'] = await fileToBase64(serializable[key]);
      serializable[key + '_name'] = serializable[key].name;
      delete serializable[key];
    }
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_PENDING, 'readwrite');
    tx.objectStore(STORE_PENDING).add({
      ...serializable,
      savedAt: new Date().toISOString()
    });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function getPendingReportes() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_PENDING, 'readonly');
    const req = tx.objectStore(STORE_PENDING).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function deleteFromQueue(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_PENDING, 'readwrite');
    tx.objectStore(STORE_PENDING).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ── Utils ─────────────────────────────────────────────────────

async function fileToBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function base64ToFile(base64, filename) {
  const res = await fetch(base64);
  const blob = await res.blob();
  return new File([blob], filename, { type: blob.type });
}

async function reconstructFiles(data) {
  const out = { ...data };
  for (const key of ['foto', 'foto_2', 'foto_3']) {
    if (out[key + '_b64']) {
      out[key] = await base64ToFile(out[key + '_b64'], out[key + '_name'] || key + '.jpg');
      delete out[key + '_b64'];
      delete out[key + '_name'];
    }
  }
  return out;
}

<script>
(function () {
  const API_URL = "";
  let currentStep = 0, formData = {}, STEPS = [], tipoReporte = "";
  const msgs = document.getElementById("cb-messages");
  const inputArea = document.getElementById("cb-input-area");
  const bar = document.getElementById("cb-bar");

  function buildSteps() {
    const tR = formData.tipo_reportante || "familiar";
    const isDesap = tipoReporte === "desaparecido";
    const ubicacionQ = !isDesap
      ? "¿Dónde está ahora mismo esta persona?"
      : tR === "familiar" ? "¿Cuál fue su última ubicación conocida?"
      : (tR === "rescatista" || tR === "personal_salud") ? "¿En qué punto de rescate o zona fue visto/a?"
      : "¿Dónde exactamente lo/la viste?";
    const estadoQ = (tR === "personal_salud" || tR === "rescatista")
      ? "¿Cuál es su estado clínico actual?"
      : "¿Cuál era su estado cuando lo/la viste por última vez?";
    const descripQ = { familiar: "¿Alguna seña particular adicional? (cicatrices, tatuajes, condiciones médicas)", personal_salud: "¿Algún detalle clínico relevante?", rescatista: "¿Algún detalle operacional relevante?", testigo: "¿Qué más recuerdas de cuando lo/la viste?" }[tR] || "¿Alguna seña particular adicional?";
    return [
      { field: "nombres_apellidos", question: "¿Cuál es el nombre completo de la persona?", subtext: "Si no lo sabes escribe 'Desconocido'", type: "text", placeholder: "Ej: Maria Gonzalez Perez", required: true },
      { field: "_doc_choice", type: "doc-choice", question: "¿Tienes información sobre su cédula de identidad?" },
      { field: "sexo", type: "buttons", question: "Ayúdanos a describir físicamente a la persona:<br><small style='color:#9ca3af;font-weight:400'>Sexo</small>", buttons: [{ label: "Masculino", value: "masculino" }, { label: "Femenino", value: "femenino" }, { label: "No determinado", value: "no_determinado" }] },
      { field: "edad_aproximada", type: "buttons", question: "<small style='color:#9ca3af;font-weight:400'>Edad aproximada</small>", buttons: [{ label: "Niño 0–12", value: "nino" }, { label: "Joven 13–25", value: "joven" }, { label: "Adulto 26–60", value: "adulto" }, { label: "Adulto mayor 60+", value: "adulto_mayor" }, { label: "No sé", value: "no_sabe" }] },
      { field: "contextura", type: "buttons", question: "<small style='color:#9ca3af;font-weight:400'>Contextura</small>", buttons: [{ label: "Delgada", value: "delgada" }, { label: "Media", value: "media" }, { label: "Robusta", value: "robusta" }, { label: "No sé", value: "no_sabe" }] },
      { field: "cabello", type: "buttons", question: "<small style='color:#9ca3af;font-weight:400'>Cabello</small>", buttons: [{ label: "Corto", value: "corto" }, { label: "Largo", value: "largo" }, { label: "Calvo/a", value: "calvo" }, { label: "Canoso/a", value: "canoso" }, { label: "No sé", value: "no_sabe" }] },
      { field: "ropa_aproximada", type: "text", question: "¿Recuerdas qué ropa llevaba? (color, tipo de prenda)", placeholder: "Ej: Camisa azul, pantalón negro", required: false },
      { field: "estado_clinico", type: "clinico", question: estadoQ },
      { field: "ultima_ubicacion", type: "text", question: ubicacionQ, placeholder: "Ej: Av. Principal, Urb. El Valle, Caracas", required: true },
      { field: "foto", type: "file", question: "📷 Foto reciente (opcional):", required: false },
      { field: "descripcion", type: "textarea", question: descripQ, placeholder: "Cualquier detalle ayuda", required: false },
      { field: "numero_contacto", type: "tel", question: "¿A qué número podemos contactarte a ti?", placeholder: "+58 412 1234567", maxlength: 15, required: true },
      { field: "quien_ayudo", type: "text", question: "¿Hay alguien más con información? ¿Nombre? (opcional)", placeholder: "Ej: Pedro Ramírez", required: false },
      { field: "contacto_quien_ayudo", type: "tel", question: "¿Cuál es el número de contacto de esa persona? (opcional)", placeholder: "Ej: +58 414 7654321", maxlength: 15, required: false },
    ];
  }

  function typing(ms = 600) {
    return new Promise(resolve => {
      const el = document.createElement("div");
      el.className = "cb-typing";
      el.innerHTML = "<div class='cb-dot'></div><div class='cb-dot'></div><div class='cb-dot'></div>";
      msgs.appendChild(el); scroll();
      setTimeout(() => { msgs.removeChild(el); resolve(); }, ms);
    });
  }

  async function botMsg(html, delay = 400) {
    await typing(delay);
    const el = document.createElement("div");
    el.className = "cb-bot"; el.innerHTML = html;
    msgs.appendChild(el); scroll();
  }

  function userMsg(text) {
    const el = document.createElement("div");
    el.className = "cb-user"; el.textContent = text;
    msgs.appendChild(el); scroll();
  }

  function scroll() { setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 60); }
  function setProgress(s) { bar.style.width = ((s / (STEPS.length || 1)) * 100).toFixed(0) + "%"; }

  async function startChat() {
    await botMsg("¿Cuál es tu rol en esta situación?", 700);
    renderTipoReportanteButtons();
  }

  function renderTipoReportanteButtons() {
    inputArea.innerHTML = "";
    [
      { label: "👤 Familiar o conocido", value: "familiar" },
      { label: "🏥 Personal de salud",   value: "personal_salud" },
      { label: "🦺 Rescatista",          value: "rescatista" },
      { label: "👁️ Testigo",            value: "testigo" },
    ].forEach(op => {
      const b = document.createElement("button");
      b.className = "cb-btn"; b.textContent = op.label;
      b.addEventListener("click", () => seleccionarTipoReportante(op.value, op.label));
      inputArea.appendChild(b);
    });
    scroll();
  }

  async function seleccionarTipoReportante(valor, label) {
    formData.tipo_reportante = valor;
    userMsg(label);
    inputArea.innerHTML = "";
    await botMsg("Entendido. ¿Qué deseas reportar?", 500);
    renderTipoButtons();
  }

  function renderTipoButtons() {
    inputArea.innerHTML = "";
    const btnDes = document.createElement("button");
    btnDes.className = "cb-btn-tipo-des";
    btnDes.textContent = "🔴 Reportar desaparecido — No sé dónde está";
    btnDes.addEventListener("click", () => seleccionarTipo("desaparecido"));
    const btnEnc = document.createElement("button");
    btnEnc.className = "cb-btn-tipo-enc";
    btnEnc.textContent = "🟢 Reportar persona encontrada — Está vivo/a pero necesita ser ubicado/a";
    btnEnc.addEventListener("click", () => seleccionarTipo("encontrado_vivo"));
    inputArea.appendChild(btnDes);
    inputArea.appendChild(btnEnc);
    scroll();
  }

  async function seleccionarTipo(tipo) {
    tipoReporte = tipo;
    formData._tipo_reporte = tipo;
    inputArea.innerHTML = "";
    userMsg(tipo === "desaparecido" ? "🔴 Reportar desaparecido" : "🟢 Reportar persona encontrada");
    await botMsg(tipo === "desaparecido"
      ? "Entendido. Voy a ayudarte a registrar a la persona desaparecida. Te haré unas preguntas rápidas. 🙏"
      : "Entendido. Gracias por reportar a esta persona. Te haré unas preguntas para que los equipos puedan ubicarla. 🙏", 600);
    STEPS = buildSteps();
    currentStep = 0;
    setTimeout(askStep, 300);
  }

  function askStep() {
    if (currentStep >= STEPS.length) { submitForm(); return; }
    const step = STEPS[currentStep];
    setProgress(currentStep);
    botMsg(step.question, 350).then(() => setTimeout(() => renderInput(step), 200));
  }

  function renderInput(step) {
    inputArea.innerHTML = "";
    if (step.type === "file")       { renderFotoPanel(); return; }
    if (step.type === "buttons")    { renderButtonStep(step); return; }
    if (step.type === "doc-choice") { renderDocChoice(); return; }
    if (step.type === "clinico")    { renderClinico(); return; }
    renderTextInput(step);
  }

  function renderButtonStep(step) {
    const grid = document.createElement("div");
    grid.className = "cb-btn-grid";
    step.buttons.forEach(opt => {
      const b = document.createElement("button");
      b.className = "cb-btn-opt"; b.textContent = opt.label;
      b.addEventListener("click", () => {
        formData[step.field] = opt.value;
        userMsg(opt.label);
        currentStep++;
        saveDraft(currentStep, formData).catch(() => {});
        askStep();
      });
      grid.appendChild(b);
    });
    inputArea.appendChild(grid);
  }

  function renderDocChoice() {
    const btnSi = document.createElement("button");
    btnSi.className = "cb-btn"; btnSi.textContent = "Sí, tengo la cédula";
    btnSi.addEventListener("click", handleDocSi);
    const btnNo = document.createElement("button");
    btnNo.className = "cb-btn cb-btn-sec"; btnNo.textContent = "No tiene documentos / No la sé";
    btnNo.addEventListener("click", () => {
      userMsg("No tiene documentos / No la sé");
      formData.sin_documentos = true;
      currentStep++;
      saveDraft(currentStep, formData).catch(() => {});
      askStep();
    });
    inputArea.appendChild(btnSi);
    inputArea.appendChild(btnNo);
  }

  async function handleDocSi() {
    inputArea.innerHTML = "";
    userMsg("Sí, tengo la cédula");
    await botMsg("¿Cuál es el número de cédula?", 350);
    inputArea.innerHTML = `
      <input type="text" id="cb-input" placeholder="Ej: V-12345678 o 12345678" maxlength="15">
      <button class="cb-btn" id="cb-next">Continuar</button>
      <button class="cb-btn cb-btn-sec" id="cb-skip">No recuerdo el número</button>`;
    const inp = document.getElementById("cb-input");
    const dispatch = () => cedulaCheck({ field: "cedula" }, inp);
    document.getElementById("cb-next").addEventListener("click", dispatch);
    document.getElementById("cb-skip").addEventListener("click", () => { currentStep++; saveDraft(currentStep, formData).catch(() => {}); askStep(); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") dispatch(); });
    setTimeout(() => inp && inp.focus(), 100);
  }

  function renderClinico() {
    const grid = document.createElement("div");
    grid.className = "cb-btn-grid";
    [
      { label: "Consciente y estable",  value: "consciente_estable" },
      { label: "Consciente y herido/a", value: "consciente_herido" },
      { label: "Inconsciente",          value: "inconsciente" },
      { label: "Desconocido",           value: "desconocido" },
    ].forEach(opt => {
      const b = document.createElement("button");
      b.className = "cb-btn-opt"; b.textContent = opt.label;
      b.addEventListener("click", () => {
        formData.estado_clinico = opt.value;
        userMsg(opt.label);
        currentStep++;
        saveDraft(currentStep, formData).catch(() => {});
        askStep();
      });
      grid.appendChild(b);
    });
    inputArea.appendChild(grid);
    const fallBtn = document.createElement("button");
    fallBtn.className = "cb-btn-fallecido"; fallBtn.textContent = "Fallecido/a"; fallBtn.style.display = "none";
    fallBtn.addEventListener("click", () => {
      if (confirm("¿Confirmas que la persona ha fallecido? Esta información es sensible.")) {
        formData.estado_clinico = "fallecido";
        userMsg("Fallecido/a");
        currentStep++;
        saveDraft(currentStep, formData).catch(() => {});
        askStep();
      }
    });
    inputArea.appendChild(fallBtn);
  }

  function renderTextInput(step) {
    const tag = step.type === "textarea" ? "textarea" : "input";
    const attrs = tag === "input" ? `type="${step.type}"${step.maxlength ? ` maxlength="${step.maxlength}"` : ""}` : "";
    const subtextHtml = step.subtext ? `<div style="font-size:12px;color:#9ca3af;padding:0 2px 2px;">${step.subtext}</div>` : "";
    inputArea.innerHTML = `
      ${subtextHtml}
      <${tag} ${attrs} id="cb-input" placeholder="${step.placeholder || ""}">${tag === "textarea" ? "</textarea>" : ""}
      <button class="cb-btn" id="cb-next">Continuar</button>
      ${!step.required ? `<button class="cb-btn cb-btn-sec" id="cb-skip">Omitir</button>` : ""}`;
    const inp = document.getElementById("cb-input");
    document.getElementById("cb-next").addEventListener("click", () => processInput(step, inp));
    const sk = document.getElementById("cb-skip");
    if (sk) sk.addEventListener("click", skipStep);
    if (step.type !== "textarea") inp.addEventListener("keydown", e => { if (e.key === "Enter") processInput(step, inp); });
    setTimeout(() => inp && inp.focus(), 100);
  }

  function renderFotoPanel() {
    const fotosArr = [];
    const MAX_FOTOS = 3;
    function renderFotoUI() {
      inputArea.innerHTML = "";
      if (fotosArr.length > 0) {
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";
        fotosArr.forEach(f => {
          const img = document.createElement("img");
          img.src = URL.createObjectURL(f);
          img.style.cssText = "width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #dc2626;";
          wrap.appendChild(img);
        });
        inputArea.appendChild(wrap);
        const cnt = document.createElement("div");
        cnt.style.cssText = "font-size:13px;color:#16a34a;";
        cnt.textContent = `✅ ${fotosArr.length}/${MAX_FOTOS} fotos seleccionadas`;
        inputArea.appendChild(cnt);
      }
      if (fotosArr.length < MAX_FOTOS) {
        const camId = "cb-fc-" + fotosArr.length, galId = "cb-fg-" + fotosArr.length;
        const small = fotosArr.length > 0;
        const camIn = document.createElement("input");
        camIn.type = "file"; camIn.accept = "image/*"; camIn.capture = "environment";
        camIn.id = camId; camIn.style.display = "none";
        inputArea.appendChild(camIn);
        const galIn = document.createElement("input");
        galIn.type = "file"; galIn.accept = "image/*";
        galIn.id = galId; galIn.style.display = "none";
        inputArea.appendChild(galIn);
        const camLbl = document.createElement("label");
        camLbl.htmlFor = camId; camLbl.className = "cb-btn";
        camLbl.style.cssText = small ? "flex:1;display:block;text-align:center;font-size:13px;padding:10px 8px;" : "display:block;text-align:center;";
        camLbl.textContent = small ? "+ 📷 Cámara" : "📷 Tomar foto";
        const galLbl = document.createElement("label");
        galLbl.htmlFor = galId; galLbl.className = "cb-btn cb-btn-sec";
        galLbl.style.cssText = small ? "flex:1;display:block;text-align:center;font-size:13px;padding:10px 8px;" : "display:block;text-align:center;";
        galLbl.textContent = small ? "+ 🖼️ Galería" : "🖼️ Adjuntar foto";
        if (small) {
          const row = document.createElement("div");
          row.style.cssText = "display:flex;gap:8px;";
          row.appendChild(camLbl); row.appendChild(galLbl);
          inputArea.appendChild(row);
        } else {
          inputArea.appendChild(camLbl); inputArea.appendChild(galLbl);
        }
        [camIn, galIn].forEach(inp => {
          inp.addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; fotosArr.push(f); renderFotoUI(); });
        });
      }
      if (fotosArr.length > 0) {
        const listoBtn = document.createElement("button");
        listoBtn.className = "cb-btn"; listoBtn.textContent = "Listo con las fotos";
        listoBtn.addEventListener("click", () => {
          if (fotosArr[0]) formData.foto   = fotosArr[0];
          if (fotosArr[1]) formData.foto_2 = fotosArr[1];
          if (fotosArr[2]) formData.foto_3 = fotosArr[2];
          const n = fotosArr.length;
          userMsg("📷 " + n + " foto" + (n > 1 ? "s" : "") + " seleccionada" + (n > 1 ? "s" : ""));
          currentStep++;
          saveDraft(currentStep, formData).catch(() => {});
          askStep();
        });
        inputArea.appendChild(listoBtn);
      } else {
        const skipBtn = document.createElement("button");
        skipBtn.className = "cb-btn cb-btn-sec"; skipBtn.textContent = "Continuar sin foto";
        skipBtn.addEventListener("click", skipStep);
        inputArea.appendChild(skipBtn);
      }
    }
    renderFotoUI();
  }

  async function cedulaCheck(step, inp) {
    const value = inp ? inp.value.trim() : "";
    if (!value) { currentStep++; saveDraft(currentStep, formData).catch(() => {}); askStep(); return; }
    try {
      const res = await fetch(`/api/check-cedula?cedula=${encodeURIComponent(value)}`);
      const data = await res.json();
      if (data.existe) {
        userMsg(value);
        formData[step.field] = value;
        inputArea.innerHTML = "";
        await botMsg("⚠️ Ya tenemos un registro con esa cédula.<br><br>Puedes continuar de todas formas — se creará un nuevo reporte independiente, lo cual puede ser útil si vienes de parte de un familiar distinto.", 400);
        inputArea.innerHTML = `
          <button class="cb-btn" id="cb-ced-ok">Continuar de todas formas</button>
          <button class="cb-btn cb-btn-sec" id="cb-ced-no">Cancelar</button>`;
        document.getElementById("cb-ced-ok").addEventListener("click", () => { currentStep++; saveDraft(currentStep, formData).catch(() => {}); askStep(); });
        document.getElementById("cb-ced-no").addEventListener("click", () => { delete formData[step.field]; handleDocSi(); });
        return;
      }
    } catch (e) { /* continúa si falla */ }
    processInput(step, inp);
  }

  function processInput(step, inp) {
    const value = inp ? inp.value.trim() : "";
    if (step.required && !value) {
      inp.style.borderColor = "#ef4444";
      inp.placeholder = "⚠️ Campo obligatorio";
      return;
    }
    if (value) { formData[step.field] = value; userMsg(value); }
    currentStep++;
    saveDraft(currentStep, formData).catch(() => {});
    askStep();
  }

  function skipStep() { currentStep++; saveDraft(currentStep, formData).catch(() => {}); askStep(); }

  // ── CAMBIO 6: submitForm con soporte offline ──────────────────

  async function submitForm() {
    setProgress(STEPS.length);
    inputArea.innerHTML = "";
    await clearDraft();

    if (navigator.onLine) {
      await botMsg('Enviando tu reporte... ⏳', 500);
      const sent = await trySend(formData);
      if (sent) { showSuccess(); return; }
    }

    await saveToQueue(formData);
    await registerSync();
    showOfflineSuccess();
  }

  async function trySend(data) {
    try {
      const fd = new FormData();
      for (const key of ['foto', 'foto_2', 'foto_3']) {
        if (data[key] instanceof File) fd.append(key, data[key]);
      }
      fd.append('sin_documentos', data.sin_documentos ? 'true' : 'false');
      Object.entries(data).forEach(([k, v]) => {
        if (k.startsWith('_') || k === 'sin_documentos') return;
        if (['foto', 'foto_2', 'foto_3'].includes(k)) return;
        if (v === null || v === undefined || v instanceof File) return;
        fd.append(k, String(v));
      });
      const res = await fetch('/api/reportes/', { method: 'POST', body: fd });
      return res.ok;
    } catch(e) { console.error('trySend error:', e); return false; }
  }

  async function registerSync() {
    if ('serviceWorker' in navigator && 'SyncManager' in window) {
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.sync.register('sync-reportes');
      } catch {}
    }
  }

  function showSuccess() {
    msgs.innerHTML = '';
    bar.style.width = '100%';
    const el = document.createElement('div');
    el.className = 'cb-success';
    el.innerHTML = `
      <div class="cb-success-icon">✅</div>
      <h4>¡Reporte enviado!</h4>
      <p>Tu reporte está registrado y disponible para los equipos de rescate. Que Dios los guíe. 🙏🇻🇪</p>
    `;
    msgs.appendChild(el);
    inputArea.innerHTML = `<button class="cb-btn" onclick="resetChat()">Reportar otra persona</button>`;
  }

  function showOfflineSuccess() {
    msgs.innerHTML = '';
    bar.style.width = '100%';
    const el = document.createElement('div');
    el.className = 'cb-success';
    el.innerHTML = `
      <div class="cb-success-icon">📡</div>
      <h4>Reporte guardado en tu dispositivo</h4>
      <p>Se enviará automáticamente cuando vuelvas a abrir esta página con conexión. <strong>No necesitas hacer nada más.</strong></p>
      <p style="font-size:12px;color:#6b7280;margin-top:8px">
        Puedes cerrar el navegador con tranquilidad. La próxima vez que abras esta página con señal, tu reporte llegará a nuestro equipo.
      </p>
    `;
    msgs.appendChild(el);
    inputArea.innerHTML = `<button class="cb-btn" onclick="resetChat()">Reportar otra persona</button>`;
  }

  function resetChat() {
    currentStep = 0;
    formData = {};
    tipoReporte = "";
    STEPS = [];
    msgs.innerHTML = '';
    bar.style.width = '0%';
    bootChat();
  }

  // ── CAMBIO 7: processPendingQueue + toasts ────────────────────

  async function processPendingQueue(pending) {
    if (!pending) pending = await getPendingReportes();
    if (!pending.length) return;

    showSyncToast(pending.length);
    let enviados = 0;

    for (const reporte of pending) {
      try {
        const data = await reconstructFiles({ ...reporte });
        delete data.id;
        delete data.savedAt;
        const sent = await trySend(data);
        if (sent) { await deleteFromQueue(reporte.id); enviados++; }
      } catch {}
    }

    hideSyncToast();
    if (enviados > 0) showSentToast(enviados);
  }

  function showSyncToast(n) {
    let t = document.getElementById('sync-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'sync-toast';
      t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
        background:#1e293b;color:white;padding:10px 20px;border-radius:99px;
        font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);`;
      document.body.appendChild(t);
    }
    t.textContent = `📡 Enviando ${n} reporte${n>1?'s':''} guardado${n>1?'s':''}...`;
    t.style.display = 'block';
  }

  function hideSyncToast() {
    const t = document.getElementById('sync-toast');
    if (t) t.style.display = 'none';
  }

  function showSentToast(n) {
    const t = document.createElement('div');
    t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      background:#16a34a;color:white;padding:10px 20px;border-radius:99px;
      font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);`;
    t.textContent = `✅ ${n} reporte${n>1?'s':''} enviado${n>1?'s':''}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  // ── CAMBIO 5: bootChat + showDraftPrompt ──────────────────────

  async function bootChat() {
    const pending = await getPendingReportes();
    if (pending.length > 0) {
      if (navigator.onLine) {
        await processPendingQueue(pending);
        await new Promise(r => setTimeout(r, 500));
      } else {
        const n = pending.length;
        const notice = document.createElement('div');
        notice.className = 'cb-bot';
        notice.textContent = `Tienes ${n} reporte${n > 1 ? 's' : ''} guardado${n > 1 ? 's' : ''} — se enviarán cuando haya señal`;
        msgs.appendChild(notice);
      }
    }

    const draft = await getDraft();
    if (draft) {
      showDraftPrompt(draft);
    } else {
      startChat();
    }
  }

  function showDraftPrompt(draft) {
    msgs.innerHTML = '';
    const minutesAgo = Math.round((Date.now() - new Date(draft.savedAt)) / 60000);
    const timeStr = minutesAgo < 60
      ? `hace ${minutesAgo} minuto${minutesAgo !== 1 ? 's' : ''}`
      : `hace ${Math.round(minutesAgo/60)} hora${Math.round(minutesAgo/60) !== 1 ? 's' : ''}`;

    const el = document.createElement('div');
    el.className = 'cb-bot';
    el.innerHTML = `
      📋 <strong>Tienes un reporte incompleto</strong> guardado ${timeStr}.<br>
      ¿Deseas continuarlo o empezar uno nuevo?
    `;
    msgs.appendChild(el);

    inputArea.innerHTML = `
      <button class="cb-btn" id="btn-continuar-draft">Continuar reporte guardado</button>
      <button class="cb-btn cb-btn-sec" id="btn-nuevo">Empezar reporte nuevo</button>
    `;

    document.getElementById('btn-continuar-draft').addEventListener('click', async () => {
      formData = await reconstructFiles(draft.formData);
      tipoReporte = formData._tipo_reporte || 'desaparecido';
      STEPS = buildSteps();
      currentStep = draft.stepIndex;
      inputArea.innerHTML = '';
      const botEl = document.createElement('div');
      botEl.className = 'cb-bot';
      botEl.textContent = 'Continuando tu reporte...';
      msgs.appendChild(botEl);
      setTimeout(() => askStep(), 400);
    });

    document.getElementById('btn-nuevo').addEventListener('click', async () => {
      await clearDraft();
      formData = {};
      tipoReporte = "";
      STEPS = [];
      currentStep = 0;
      msgs.innerHTML = '';
      startChat();
    });
  }

  // ── CAMBIO 8: listeners de conexión y SW ──────────────────────

  window.addEventListener('online', () => processPendingQueue());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'SYNC_NOW') processPendingQueue();
    });
  }

  window.resetChat = resetChat;
  window.bootChat = bootChat;
  window.installApp = typeof installApp !== 'undefined' ? installApp : function(){};

  bootChat();
})();
</script>

<!-- CAMBIO 9: Banner instalar PWA -->
<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `position:fixed;top:0;left:0;right:0;background:#1e293b;
    color:white;padding:10px 16px;display:flex;align-items:center;
    justify-content:space-between;font-size:13px;z-index:9999;`;
  banner.innerHTML = `
    <span>📲 Instala esta app para usarla sin internet</span>
    <div style="display:flex;gap:8px">
      <button onclick="installApp()" style="background:#dc2626;color:white;border:none;
        padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px">Instalar</button>
      <button onclick="this.closest('#install-banner').remove()"
        style="background:transparent;color:#94a3b8;border:none;cursor:pointer;font-size:18px">×</button>
    </div>
  `;
  document.body.prepend(banner);
});

async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner')?.remove();
}
</script>

<!-- CAMBIO 10: Registro del Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  });
}
</script>
