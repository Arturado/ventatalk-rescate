<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reportar — Venezuela Rescate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: #f5f5f5;
    }

    /* HEADER */
    #cb-header {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #cb-header svg { width: 28px; height: 28px; }
    #cb-header h1 { font-size: 16px; font-weight: 700; }
    #cb-header p { font-size: 11px; opacity: .85; }
    #cb-progress { height: 3px; background: #fecaca; flex-shrink: 0; }
    #cb-bar { height: 100%; background: white; transition: width .4s; width: 0%; }

    /* MESSAGES */
    #cb-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }
    .cb-bot, .cb-user {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.55;
    }
    .cb-bot { background: white; color: #111; border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cb-user { background: #dc2626; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
    .cb-typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; background: white; border-radius: 16px; border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; animation: cb-bounce 1.2s ease-in-out infinite; }
    .cb-dot:nth-child(2) { animation-delay: .2s; }
    .cb-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes cb-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }

    /* INPUT AREA */
    #cb-input-area {
      flex-shrink: 0;
      padding: 12px 16px 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    #cb-input-area input, #cb-input-area textarea {
      width: 100%; border: 1.5px solid #d1d5db;
      border-radius: 10px; padding: 11px 14px; font-size: 15px;
      outline: none; resize: none; color: #111; background: #fafafa;
      transition: border-color .15s;
    }
    #cb-input-area input:focus, #cb-input-area textarea:focus { border-color: #dc2626; background: #fff; }
    #cb-input-area textarea { height: 80px; }
    .cb-btn {
      width: 100%; padding: 12px 16px;
      background: #dc2626; color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .cb-btn:hover { background: #b91c1c; }
    .cb-btn-sec {
      background: transparent; color: #6b7280;
      border: 1.5px solid #e5e7eb;
    }
    .cb-btn-sec:hover { background: #f9fafb; }

    /* TIPO SELECTOR BUTTONS */
    .cb-btn-tipo-des {
      width: 100%; padding: 16px;
      background: #dc2626; color: white;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-align: left; line-height: 1.4;
      transition: background .15s;
    }
    .cb-btn-tipo-des:hover { background: #b91c1c; }
    .cb-btn-tipo-enc {
      width: 100%; padding: 16px;
      background: #16a34a; color: white;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-align: left; line-height: 1.4;
      transition: background .15s;
    }
    .cb-btn-tipo-enc:hover { background: #15803d; }

    #cb-file-label {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px;
      border: 1.5px dashed #d1d5db; border-radius: 10px;
      color: #374151; font-size: 14px; cursor: pointer;
    }
    #cb-file-label:hover { border-color: #dc2626; background: #fff5f5; }
    #cb-file-preview { font-size: 13px; color: #16a34a; text-align: center; }

    /* SUCCESS */
    .cb-success {
      text-align: center; padding: 40px 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
    }
    .cb-success-icon { font-size: 64px; }
    .cb-success h2 { font-size: 22px; color: #16a34a; font-weight: 800; }
    .cb-success p { font-size: 15px; color: #6b7280; line-height: 1.65; max-width: 320px; }

    @media (min-width: 700px) {
      body { align-items: center; background: #f0f0f0; }
      #cb-header { border-radius: 0; }
      #cb-messages, #cb-input-area { max-width: 580px; }
    }
  </style>
</head>
<body>

<div id="cb-header">
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="M12 8v4M12 16h.01"/>
  </svg>
  <div>
    <h1>Venezuela Rescate</h1>
    <p>Sistema de reportes de personas</p>
  </div>
</div>
<div id="cb-progress"><div id="cb-bar"></div></div>

<div id="cb-messages"></div>
<div id="cb-input-area"></div>

<script>
(function () {
  const API_URL = "";

  const STEPS_DESAPARECIDO = [
    { field: "nombres_apellidos", question: "¿Cuál es el nombre completo de la persona desaparecida?", type: "text", placeholder: "Ej: Maria Gonzalez Perez", required: true },
    { field: "cedula", question: "¿Conoces su número de cédula?", type: "text", placeholder: "Ej: V-12345678", required: false },
    { field: "ultima_ubicacion", question: "¿Cuál fue su última ubicación conocida?", type: "text", placeholder: "Ej: Calle 5, Urb. El Valle, Caracas", required: true },
    { field: "foto", question: "📷 Foto reciente (opcional):", type: "file", required: false },
    { field: "descripcion", question: "Agrega cualquier descripción adicional (ropa, señas, condiciones de salud...)", type: "textarea", placeholder: "Cualquier detalle ayuda", required: false },
    { field: "numero_contacto", question: "¿A qué número podemos contactarte a ti?", type: "tel", placeholder: "Ej: +58 412 1234567", required: true },
    { field: "quien_ayudo", question: "¿Hay alguien que la esté ayudando o la haya visto? ¿Cuál es su nombre? (opcional)", type: "text", placeholder: "Ej: Pedro Ramírez", required: false },
    { field: "contacto_quien_ayudo", question: "¿Cuál es el número de contacto de esa persona? (opcional)", type: "tel", placeholder: "Ej: +58 414 7654321", required: false },
  ];

  const STEPS_ENCONTRADO = [
    { field: "nombres_apellidos", question: "¿Cuál es el nombre completo de la persona encontrada? (si no lo sabes escribe 'Desconocido')", type: "text", placeholder: "Ej: Maria Gonzalez o Desconocido", required: true },
    { field: "cedula", question: "¿Conoces su número de cédula?", type: "text", placeholder: "Ej: V-12345678", required: false },
    { field: "ultima_ubicacion", question: "¿Dónde está ahora mismo esta persona?", type: "text", placeholder: "Ej: Refugio El Valle, Av. Principal", required: true },
    { field: "foto", question: "📷 Foto de la persona (opcional):", type: "file", required: false },
    { field: "descripcion", question: "¿Cómo se encuentra? Describe su estado físico y cualquier detalle importante", type: "textarea", placeholder: "Ej: Estable, consciente, sin documentos...", required: false },
    { field: "numero_contacto", question: "¿A qué número podemos contactarte a ti (quien la encontró)?", type: "tel", placeholder: "Ej: +58 412 1234567", required: true },
    { field: "quien_ayudo", question: "¿Sabes si tiene familiares buscándola? ¿Nombre de algún familiar? (opcional)", type: "text", placeholder: "Ej: Juan Pérez", required: false },
    { field: "contacto_quien_ayudo", question: "¿Cuál es el número de contacto de ese familiar? (opcional)", type: "tel", placeholder: "Ej: +58 414 7654321", required: false },
  ];

  let currentStep = 0, formData = {}, STEPS = [], tipoReporte = "";
  const msgs = document.getElementById("cb-messages");
  const inputArea = document.getElementById("cb-input-area");
  const bar = document.getElementById("cb-bar");

  function typing(ms = 600) {
    return new Promise(resolve => {
      const el = document.createElement("div");
      el.className = "cb-typing";
      el.innerHTML = "<div class='cb-dot'></div><div class='cb-dot'></div><div class='cb-dot'></div>";
      msgs.appendChild(el); scroll();
      setTimeout(() => { msgs.removeChild(el); resolve(); }, ms);
    });
  }

  async function botMsg(html, delay = 400) {
    await typing(delay);
    const el = document.createElement("div");
    el.className = "cb-bot";
    el.innerHTML = html;
    msgs.appendChild(el); scroll();
  }

  function userMsg(text) {
    const el = document.createElement("div");
    el.className = "cb-user";
    el.textContent = text;
    msgs.appendChild(el); scroll();
  }

  function scroll() { setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 60); }
  function setProgress(s) { bar.style.width = ((s / STEPS.length) * 100).toFixed(0) + "%"; }

  async function startChat() {
    await botMsg("Hola. ¿Qué deseas reportar?", 700);
    renderTipoButtons();
  }

  function renderTipoButtons() {
    inputArea.innerHTML = "";
    const btnDes = document.createElement("button");
    btnDes.className = "cb-btn-tipo-des";
    btnDes.textContent = "🔴 Reportar desaparecido — No sé dónde está";
    btnDes.addEventListener("click", () => seleccionarTipo("desaparecido"));

    const btnEnc = document.createElement("button");
    btnEnc.className = "cb-btn-tipo-enc";
    btnEnc.textContent = "🟢 Reportar persona encontrada — Está vivo/a pero necesita ser ubicado/a";
    btnEnc.addEventListener("click", () => seleccionarTipo("encontrado_vivo"));

    inputArea.appendChild(btnDes);
    inputArea.appendChild(btnEnc);
    scroll();
  }

  async function seleccionarTipo(tipo) {
    tipoReporte = tipo;
    STEPS = tipo === "desaparecido" ? STEPS_DESAPARECIDO : STEPS_ENCONTRADO;
    inputArea.innerHTML = "";
    userMsg(tipo === "desaparecido"
      ? "🔴 Reportar desaparecido"
      : "🟢 Reportar persona encontrada");
    const confirmMsg = tipo === "desaparecido"
      ? "Entendido. Voy a ayudarte a registrar a la persona desaparecida. Te haré unas preguntas rápidas. 🙏"
      : "Entendido. Gracias por reportar a esta persona. Te haré unas preguntas para que los equipos puedan ubicarla. 🙏";
    await botMsg(confirmMsg, 600);
    setTimeout(askStep, 300);
  }

  function askStep() {
    if (currentStep >= STEPS.length) { submitForm(); return; }
    const step = STEPS[currentStep];
    setProgress(currentStep);
    botMsg(step.question, 350).then(() => setTimeout(() => renderInput(step), 200));
  }

  function renderInput(step) {
    inputArea.innerHTML = "";
    if (step.type === "file") {
      const fotosArr = [];
      const MAX_FOTOS = 3;

      function renderFotoPanel() {
        inputArea.innerHTML = "";

        if (fotosArr.length > 0) {
          const wrap = document.createElement("div");
          wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";
          fotosArr.forEach(f => {
            const img = document.createElement("img");
            img.src = URL.createObjectURL(f);
            img.style.cssText = "width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #dc2626;";
            wrap.appendChild(img);
          });
          inputArea.appendChild(wrap);
          const cnt = document.createElement("div");
          cnt.style.cssText = "font-size:13px;color:#16a34a;";
          cnt.textContent = `✅ ${fotosArr.length}/${MAX_FOTOS} fotos seleccionadas`;
          inputArea.appendChild(cnt);
        }

        if (fotosArr.length < MAX_FOTOS) {
          const camId = "cb-fc-" + fotosArr.length;
          const galId = "cb-fg-" + fotosArr.length;
          const small = fotosArr.length > 0;

          const camIn = document.createElement("input");
          camIn.type = "file"; camIn.accept = "image/*"; camIn.capture = "environment";
          camIn.id = camId; camIn.style.display = "none";
          inputArea.appendChild(camIn);

          const galIn = document.createElement("input");
          galIn.type = "file"; galIn.accept = "image/*";
          galIn.id = galId; galIn.style.display = "none";
          inputArea.appendChild(galIn);

          const camLbl = document.createElement("label");
          camLbl.htmlFor = camId; camLbl.className = "cb-btn";
          camLbl.style.cssText = small ? "flex:1;display:block;text-align:center;font-size:13px;padding:10px 8px;" : "display:block;text-align:center;";
          camLbl.textContent = small ? "+ 📷 Cámara" : "📷 Tomar foto";

          const galLbl = document.createElement("label");
          galLbl.htmlFor = galId; galLbl.className = "cb-btn cb-btn-sec";
          galLbl.style.cssText = small ? "flex:1;display:block;text-align:center;font-size:13px;padding:10px 8px;" : "display:block;text-align:center;";
          galLbl.textContent = small ? "+ 🖼️ Galería" : "🖼️ Adjuntar foto";

          if (small) {
            const row = document.createElement("div");
            row.style.cssText = "display:flex;gap:8px;";
            row.appendChild(camLbl); row.appendChild(galLbl);
            inputArea.appendChild(row);
          } else {
            inputArea.appendChild(camLbl); inputArea.appendChild(galLbl);
          }

          [camIn, galIn].forEach(inp => {
            inp.addEventListener("change", e => {
              const f = e.target.files[0]; if (!f) return;
              fotosArr.push(f); renderFotoPanel();
            });
          });
        }

        if (fotosArr.length > 0) {
          const listoBtn = document.createElement("button");
          listoBtn.className = "cb-btn";
          listoBtn.textContent = "Listo con las fotos";
          listoBtn.addEventListener("click", () => {
            formData.fotos = fotosArr.slice();
            const n = fotosArr.length;
            userMsg("📷 " + n + " foto" + (n > 1 ? "s" : "") + " seleccionada" + (n > 1 ? "s" : ""));
            currentStep++; askStep();
          });
          inputArea.appendChild(listoBtn);
        } else {
          const skipBtn = document.createElement("button");
          skipBtn.className = "cb-btn cb-btn-sec";
          skipBtn.textContent = "Continuar sin foto";
          skipBtn.addEventListener("click", skipStep);
          inputArea.appendChild(skipBtn);
        }
      }

      renderFotoPanel();
      return;
    }
    const tag = step.type === "textarea" ? "textarea" : "input";
    const attrs = tag === "input" ? `type="${step.type}"` : "";
    inputArea.innerHTML = `
      <${tag} ${attrs} id="cb-input" placeholder="${step.placeholder || ""}">${tag === "textarea" ? "</textarea>" : ""}
      <button class="cb-btn" id="cb-next">Continuar</button>
      ${!step.required ? `<button class="cb-btn cb-btn-sec" id="cb-skip">Omitir</button>` : ""}`;
    const inp = document.getElementById("cb-input");
    const dispatch = () => step.field === "cedula" ? cedulaCheck(step, inp) : processInput(step, inp);
    document.getElementById("cb-next").addEventListener("click", dispatch);
    const sk = document.getElementById("cb-skip");
    if (sk) sk.addEventListener("click", skipStep);
    if (step.type !== "textarea") {
      inp.addEventListener("keydown", e => { if (e.key === "Enter") dispatch(); });
    }
    setTimeout(() => inp && inp.focus(), 100);
  }

  async function cedulaCheck(step, inp) {
    const value = inp ? inp.value.trim() : "";
    if (!value) { skipStep(); return; }
    try {
      const res = await fetch(`/api/check-cedula?cedula=${encodeURIComponent(value)}`);
      const data = await res.json();
      if (data.existe) {
        userMsg(value);
        formData[step.field] = value;
        inputArea.innerHTML = "";
        await botMsg("⚠️ Ya tenemos un registro con esa cédula.<br><br>Puedes continuar de todas formas — se creará un nuevo reporte independiente, lo cual puede ser útil si vienes de parte de un familiar distinto.", 400);
        inputArea.innerHTML = `
          <button class="cb-btn" id="cb-ced-ok">Continuar de todas formas</button>
          <button class="cb-btn cb-btn-sec" id="cb-ced-no">Cancelar</button>`;
        document.getElementById("cb-ced-ok").addEventListener("click", () => { currentStep++; askStep(); });
        document.getElementById("cb-ced-no").addEventListener("click", () => { delete formData[step.field]; renderInput(step); });
        return;
      }
    } catch (e) { /* continúa normalmente si el fetch falla */ }
    processInput(step, inp);
  }

  function processInput(step, inp) {
    const value = inp ? inp.value.trim() : "";
    if (step.required && !value) {
      inp.style.borderColor = "#ef4444";
      inp.placeholder = "⚠️ Campo obligatorio";
      return;
    }
    if (value) { formData[step.field] = value; userMsg(value); }
    currentStep++; askStep();
  }

  function skipStep() { currentStep++; askStep(); }

  async function submitForm() {
    setProgress(STEPS.length);
    inputArea.innerHTML = "";
    await botMsg("Enviando reporte... ⏳", 500);
    try {
      const fd = new FormData();
      fd.append("nombres_apellidos", formData.nombres_apellidos || "");
      if (formData.cedula) fd.append("cedula", formData.cedula);
      fd.append("ultima_ubicacion", formData.ultima_ubicacion || "");
      if (formData.descripcion) fd.append("descripcion", formData.descripcion);
      fd.append("numero_contacto", formData.numero_contacto || "");
      if (formData.quien_ayudo) fd.append("quien_ayudo", formData.quien_ayudo);
      if (formData.contacto_quien_ayudo) fd.append("contacto_quien_ayudo", formData.contacto_quien_ayudo);
      fd.append("tipo_reporte", tipoReporte);
      if (formData.fotos) {
        if (formData.fotos[0]) fd.append("foto", formData.fotos[0]);
        if (formData.fotos[1]) fd.append("foto_2", formData.fotos[1]);
        if (formData.fotos[2]) fd.append("foto_3", formData.fotos[2]);
      }
      const res = await fetch(API_URL + "/api/reportes/", { method: "POST", body: fd });
      if (!res.ok) throw new Error("Error " + res.status);

      const successMsg = tipoReporte === "encontrado_vivo"
        ? "¡Reporte enviado! Gracias por reportar a esta persona. Los equipos la ubicarán con su familia."
        : "¡Reporte enviado! Tu reporte está registrado y disponible para los equipos de rescate.";

      msgs.innerHTML = "";
      inputArea.innerHTML = "";
      bar.style.width = "100%";
      const ok = document.createElement("div");
      ok.className = "cb-success";
      ok.innerHTML = `
        <div class="cb-success-icon">✅</div>
        <h2>¡Reporte enviado!</h2>
        <p>${successMsg} Que Dios los guíe. 🙏🇻🇪</p>`;
      msgs.appendChild(ok);
      inputArea.innerHTML = `<button class="cb-btn cb-btn-sec" id="cb-new">Hacer otro reporte</button>`;
      document.getElementById("cb-new").addEventListener("click", () => {
        currentStep = 0; formData = {}; tipoReporte = ""; STEPS = [];
        msgs.innerHTML = ""; bar.style.width = "0%";
        startChat();
      });
    } catch (err) {
      await botMsg("❌ Error al enviar. Intenta de nuevo.");
      inputArea.innerHTML = `<button class="cb-btn" id="cb-retry">Reintentar</button>`;
      document.getElementById("cb-retry").addEventListener("click", submitForm);
    }
  }

  startChat();
})();
</script>
</body>
</html>
