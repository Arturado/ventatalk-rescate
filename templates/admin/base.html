<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Venezuela Rescate — Admin{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
    .admin-header {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .admin-header .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .admin-header .brand svg { width: 28px; height: 28px; }
    .admin-header nav a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: 14px;
      margin-left: 20px;
    }
    .admin-header nav a:hover { color: white; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background .15s;
    }
    .btn-red { background: #dc2626; color: white; }
    .btn-red:hover { background: #b91c1c; }
    .btn-green { background: #16a34a; color: white; }
    .btn-green:hover { background: #15803d; }
    .btn-gray { background: #6b7280; color: white; }
    .btn-gray:hover { background: #4b5563; }
    .btn-outline { background: transparent; color: #dc2626; border: 1.5px solid #dc2626; }
    .btn-outline:hover { background: #fef2f2; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
{% block header %}
<header class="admin-header">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="M12 8v4M12 16h.01"/>
    </svg>
    Venezuela Rescate
  </div>
  <nav>
    <a href="/admin/dashboard">Panel</a>
    <a href="/admin/export/csv">Exportar CSV</a>
    <a href="/admin/logout">Cerrar sesión</a>
  </nav>
</header>
{% endblock %}
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
