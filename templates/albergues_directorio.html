<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio — Centros de Albergue — Venezuela Rescate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff; color: #111;
      min-height: 100dvh;
    }

    .wrap { max-width: 700px; margin: 0 auto; padding: 24px 18px 48px; }

    .titulo { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .subtitulo { font-size: 13px; color: #6b7280; margin-bottom: 24px; }

    .zona-block { margin-bottom: 22px; border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; }
    .zona-hdr {
      background: #dc2626; color: white;
      font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
      padding: 10px 14px;
    }
    .zona-items { padding: 4px 14px 10px; }

    .centro-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .centro-item:last-child { border-bottom: none; }
    .centro-nombre { font-size: 14px; font-weight: 700; color: #111; }
    .centro-nombre::before { content: "• "; color: #dc2626; }
    .centro-direccion { font-size: 12.5px; color: #6b7280; margin: 3px 0 8px 12px; }

    .btn-reportar {
      display: inline-block; margin-left: 12px;
      padding: 8px 16px; background: #dc2626; color: white;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      text-decoration: none; cursor: pointer;
      transition: background .15s;
    }
    .btn-reportar:hover { background: #b91c1c; }

    .state-msg { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb; border-top-color: #dc2626;
      border-radius: 50%; animation: spin .7s linear infinite;
      display: inline-block; margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="titulo">🏠 Centros de Albergue — Venezuela Rescate</div>
  <div class="subtitulo">Directorio actualizado en tiempo real</div>

  <div id="directorio">
    <div class="state-msg"><div class="spinner"></div><br>Cargando centros...</div>
  </div>
</div>

<script>
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function agruparPorZona(centros) {
  var grupos = {};
  var orden = [];
  centros.forEach(function(c) {
    var zona = c.zona || 'Sin zona';
    if (!grupos[zona]) { grupos[zona] = []; orden.push(zona); }
    grupos[zona].push(c);
  });
  return { grupos: grupos, orden: orden };
}

function renderZona(zona, centros) {
  var itemsHtml = centros.map(function(c) {
    return '<div class="centro-item">' +
      '<div class="centro-nombre">' + esc(c.nombre) + '</div>' +
      (c.direccion ? '<div class="centro-direccion">' + esc(c.direccion) + '</div>' : '') +
      '<a href="/albergues/reportar/' + c.id + '" class="btn-reportar">📋 Reportar estado →</a>' +
    '</div>';
  }).join('');

  return '<div class="zona-block">' +
    '<div class="zona-hdr">' + esc(zona.toUpperCase()) + '</div>' +
    '<div class="zona-items">' + itemsHtml + '</div>' +
  '</div>';
}

function renderDirectorio(centros) {
  var el = document.getElementById('directorio');
  if (!centros.length) {
    el.innerHTML = '<div class="state-msg">No hay centros de albergue registrados.</div>';
    return;
  }
  var agrupado = agruparPorZona(centros);
  el.innerHTML = agrupado.orden.map(function(zona) {
    return renderZona(zona, agrupado.grupos[zona]);
  }).join('');
}

async function loadDirectorio() {
  try {
    var res = await fetch('/api/albergues/centros');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var centros = await res.json();
    renderDirectorio(centros);
  } catch(e) {
    document.getElementById('directorio').innerHTML =
      '<div class="state-msg">❌ Error al cargar el directorio.<br>' +
      '<button onclick="loadDirectorio()" style="margin-top:12px;padding:8px 20px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">Reintentar</button></div>';
  }
}

loadDirectorio();
</script>
</body>
</html>
