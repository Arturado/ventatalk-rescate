<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centros de Acopio — Venezuela Rescate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; color: #111;
      min-height: 100dvh;
    }

    /* HEADER */
    .hdr { background: #dc2626; color: white; padding: 16px 20px; }
    .hdr-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
    }
    .hdr-left { display: flex; align-items: center; gap: 12px; }
    .hdr-icon { font-size: 28px; flex-shrink: 0; }
    .hdr-title { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .hdr-sub { font-size: 13px; opacity: .85; margin-top: 2px; }
    .hdr-badge {
      font-size: 12px; padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,.2); font-weight: 600; white-space: nowrap;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: rgba(255,255,255,.8); text-decoration: none;
      font-weight: 600; padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,.15); transition: background .15s;
    }
    .btn-back:hover { background: rgba(255,255,255,.25); }

    /* PILLS */
    .pills-wrap {
      max-width: 1200px; margin: 0 auto;
      padding: 16px 20px 8px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .pill {
      padding: 7px 16px; border: 1.5px solid #d1d5db;
      border-radius: 20px; background: #fff;
      font-size: 13px; font-weight: 600; color: #374151;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .pill:hover { border-color: #dc2626; color: #dc2626; }
    .pill.active { background: #dc2626; color: white; border-color: #dc2626; }

    /* GRID */
    .grid-wrap { max-width: 1200px; margin: 0 auto; padding: 8px 20px 48px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    /* CARD */
    .card {
      background: #fff; border-radius: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      padding: 16px;
      display: flex; flex-direction: column;
    }
    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .card-name { font-size: 15px; font-weight: 700; color: #111; line-height: 1.3; }
    .card-meta { font-size: 12px; color: #9ca3af; margin-top: 3px; }

    .badge {
      flex-shrink: 0; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; white-space: nowrap;
      line-height: 1.4;
    }
    .badge-green  { background: #dcfce7; color: #15803d; }
    .badge-yellow { background: #fefce8; color: #a16207; }
    .badge-red    { background: #fef2f2; color: #dc2626; }
    .badge-gray   { background: #f3f4f6; color: #6b7280; }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 10px 0; }

    .pop-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; flex-wrap: wrap; margin-bottom: 2px;
    }
    .pop-total { font-size: 16px; font-weight: 800; color: #111; }
    .pop-item { color: #6b7280; font-size: 12px; }

    .needs-block { font-size: 13px; }
    .needs-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; margin: 8px 0 3px;
    }
    .needs-label.green { color: #16a34a; }
    .needs-label.red   { color: #dc2626; }
    .needs-txt { color: #374151; line-height: 1.5; word-break: break-word; }
    .needs-none { color: #9ca3af; font-style: italic; font-size: 12px; }

    .no-reporte-msg {
      font-size: 13px; color: #9ca3af; font-style: italic;
      text-align: center; padding: 12px 0;
    }

    .reportes-hoy {
      font-size: 11px; color: #6b7280; margin-top: 6px;
    }

    .btn-report {
      display: block; width: 100%; padding: 11px;
      background: #dc2626; color: white;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; text-align: center;
      text-decoration: none; margin-top: auto; padding-top: 11px;
      transition: background .15s;
      margin-top: 12px;
    }
    .btn-report:hover { background: #b91c1c; }

    /* STATES */
    .state-msg { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; grid-column: 1/-1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb; border-top-color: #dc2626;
      border-radius: 50%; animation: spin .7s linear infinite;
      display: inline-block; margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .hdr-title { font-size: 15px; }
      .hdr-sub { display: none; }
    }

    /* BUSCADOR */
    .search-wrap { max-width:1200px; margin:0 auto; padding:14px 20px 4px; }
    .search-input {
      width:100%; max-width:500px; padding:10px 14px;
      border:1.5px solid #d1d5db; border-radius:10px;
      font-size:14px; color:#111; outline:none;
      transition:border-color .15s; background:#fff;
    }
    .search-input:focus { border-color:#dc2626; }

    /* BOTÓN NO ENCUENTRO MI CENTRO */
    .btn-no-centro {
      display:block; margin:20px auto 0;
      padding:10px 22px;
      border:2px solid #dc2626; border-radius:10px;
      background:transparent; color:#dc2626;
      font-size:14px; font-weight:700; cursor:pointer;
      transition:all .15s;
    }
    .btn-no-centro:hover { background:#dc2626; color:white; }

    /* MODAL SOLICITUD */
    .sol-modal-bd {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.55); z-index:200;
      align-items:flex-start; justify-content:center;
      padding:40px 16px 80px; overflow-y:auto;
    }
    .sol-modal-bd.open { display:flex; }
    .sol-modal {
      background:#fff; border-radius:16px; padding:24px;
      width:100%; max-width:480px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .sol-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .sol-title { font-size:16px; font-weight:800; }
    .sol-x { border:none; background:transparent; font-size:24px; cursor:pointer; color:#9ca3af; line-height:1; padding:0 4px; }
    .sol-x:hover { color:#111; }
    .sol-fg { margin-bottom:12px; }
    .sol-fg label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:5px; }
    .sol-fg input, .sol-fg select, .sol-fg textarea {
      width:100%; padding:9px 12px; border:1.5px solid #d1d5db;
      border-radius:7px; font-size:14px; outline:none; color:#111;
      transition:border-color .15s; box-sizing:border-box; background:#fff;
    }
    .sol-fg input:focus, .sol-fg select:focus, .sol-fg textarea:focus { border-color:#dc2626; }
    .sol-fg textarea { resize:vertical; min-height:70px; font-family:inherit; }
    .sol-btn {
      width:100%; padding:12px; background:#dc2626;
      color:white; border:none; border-radius:8px;
      font-size:15px; font-weight:700; cursor:pointer;
      margin-top:6px; transition:background .15s;
    }
    .sol-btn:hover { background:#b91c1c; }
    .sol-btn:disabled { background:#9ca3af; cursor:not-allowed; }
    .sol-success { text-align:center; padding:20px 0; color:#15803d; font-weight:700; font-size:15px; line-height:1.6; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-icon">📦</div>
      <div>
        <div class="hdr-title">Venezuela Rescate · Centros de Acopio</div>
        <div class="hdr-sub">Estado actualizado en tiempo real</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="hdr-badge" id="ultimo-refresh">Cargando...</div>
      <a href="/" class="btn-back">← Inicio</a>
    </div>
  </div>
</header>

<div class="search-wrap">
  <input type="text" id="buscador-centro" class="search-input"
    placeholder="🔍 Buscar centro de acopio..."
    oninput="buscarCentro(this.value)">
</div>

<div class="pills-wrap">
  <button class="pill active" data-zona="" onclick="filtrarZona(this)">Todas</button>
  <button class="pill" data-zona="Caracas - Libertador" onclick="filtrarZona(this)">Libertador</button>
  <button class="pill" data-zona="Caracas - Chacao" onclick="filtrarZona(this)">Chacao</button>
  <button class="pill" data-zona="Caracas - Sucre" onclick="filtrarZona(this)">Sucre</button>
  <button class="pill" data-zona="Caracas - Baruta" onclick="filtrarZona(this)">Baruta</button>
  <button class="pill" data-zona="Vargas" onclick="filtrarZona(this)">Vargas</button>
  <button class="pill" data-zona="Miranda" onclick="filtrarZona(this)">Miranda</button>
</div>

<div class="grid-wrap">
  <div id="grid" class="grid">
    <div class="state-msg"><div class="spinner"></div><br>Cargando centros...</div>
  </div>
  <button class="btn-no-centro" onclick="openSolModal()">📍 No encuentro mi centro — Reportarlo</button>
</div>

<script>
var _data = [];
var _zonaFiltro = '';
var _busqueda = '';

function semaforo(ultimoReporte) {
  if (!ultimoReporte) return { cls: 'badge-gray', txt: '⚫ Sin reporte' };
  var diffMin = (Date.now() - new Date(ultimoReporte.created_at).getTime()) / 60000;
  if (diffMin < 120) return { cls: 'badge-green',  txt: '🟢 Hace ' + fmtTiempo(diffMin) };
  if (diffMin < 360) return { cls: 'badge-yellow', txt: '🟡 Hace ' + fmtTiempo(diffMin) };
  return { cls: 'badge-red', txt: '🔴 Hace ' + fmtTiempo(diffMin) };
}

function fmtTiempo(min) {
  if (min < 2) return '1 min';
  if (min < 60) return Math.floor(min) + ' min';
  var h = Math.floor(min / 60);
  var m = Math.floor(min % 60);
  return m > 0 ? h + 'h ' + m + 'min' : h + 'h';
}

function juntarItems(a, b) {
  var items = [];
  if (a) items = items.concat(a.split(',').map(function(s){return s.trim();}).filter(Boolean));
  if (b) items = items.concat(b.split(',').map(function(s){return s.trim();}).filter(Boolean));
  return items;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(item) {
  var c = item.centro;
  var r = item.ultimo_reporte;
  var hoy = item.total_reportes_hoy || 0;
  var sem = semaforo(r);

  var topHtml =
    '<div class="card-top">' +
      '<div>' +
        '<div class="card-name">' + esc(c.nombre) + '</div>' +
        (c.direccion ? '<div class="card-meta">' + esc(c.direccion) + '</div>' : '') +
        (c.zona ? '<div class="card-meta">📍 ' + esc(c.zona) + '</div>' : '') +
      '</div>' +
      '<span class="badge ' + sem.cls + '">' + sem.txt + '</span>' +
    '</div>';

  var bodyHtml = '';
  if (r) {
    var total = (r.hombres||0) + (r.mujeres||0) + (r.ninos||0) + (r.lactantes||0);
    bodyHtml += '<hr class="divider">' +
      '<div class="pop-row">' +
        '<span class="pop-total">👥 ' + total + '</span>' +
        '<span class="pop-item">👨 H:' + (r.hombres||0) + '</span>' +
        '<span class="pop-item">👩 M:' + (r.mujeres||0) + '</span>' +
        '<span class="pop-item">👶 N:' + (r.ninos||0) + '</span>' +
        '<span class="pop-item">🍼 L:' + (r.lactantes||0) + '</span>' +
      '</div>';

    var nec = juntarItems(r.necesitan, r.necesitan_extra);
    var noNec = juntarItems(r.no_necesitan, r.no_necesitan_extra);

    bodyHtml += '<hr class="divider"><div class="needs-block">' +
      '<div class="needs-label green">✅ Necesitan:</div>' +
      '<div class="needs-txt">' + (nec.length ? esc(nec.join(', ')) : '<span class="needs-none">No indicado</span>') + '</div>' +
      '<div class="needs-label red">❌ NO necesitan:</div>' +
      '<div class="needs-txt">' + (noNec.length ? esc(noNec.join(', ')) : '<span class="needs-none">No indicado</span>') + '</div>' +
    '</div>';

    if (hoy > 0) {
      bodyHtml += '<div class="reportes-hoy">📋 ' + hoy + ' reporte' + (hoy === 1 ? '' : 's') + ' hoy</div>';
    }
  } else {
    bodyHtml += '<div class="no-reporte-msg">Sin reporte hoy — toca para actualizar</div>';
  }

  return '<div class="card" data-zona="' + esc(c.zona||'') + '">' +
    topHtml + bodyHtml +
    '<a href="/acopio/reportar/' + c.id + '" class="btn-report">📋 Actualizar reporte</a>' +
  '</div>';
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var items = _data.filter(function(item) {
    if (_busqueda) {
      var n = (item.centro.nombre || '').toLowerCase();
      var d = (item.centro.direccion || '').toLowerCase();
      return n.indexOf(_busqueda) !== -1 || d.indexOf(_busqueda) !== -1;
    }
    if (!_zonaFiltro) return true;
    return (item.centro.zona || '').toLowerCase().indexOf(_zonaFiltro.toLowerCase()) !== -1;
  });
  if (!items.length) {
    grid.innerHTML = _busqueda
      ? '<div class="state-msg">No encontramos "<strong>' + esc(_busqueda) + '</strong>" en ningún centro.<br><br>' +
        '<button onclick="openSolModal()" class="btn-no-centro" style="margin-top:0;">📍 Reportar este centro</button></div>'
      : '<div class="state-msg">Sin centros en esta zona.</div>';
    return;
  }
  grid.innerHTML = items.map(renderCard).join('');
}

function buscarCentro(val) {
  _busqueda = val.trim().toLowerCase();
  renderGrid();
}

function filtrarZona(btn) {
  document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  _zonaFiltro = btn.dataset.zona;
  renderGrid();
}

async function loadData() {
  try {
    var res = await fetch('/api/acopio/estado');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    _data = await res.json();
    renderGrid();
    var hora = new Date().toLocaleTimeString('es-VE', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Caracas'
    });
    document.getElementById('ultimo-refresh').textContent = '🕐 Actualizado ' + hora;
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div class="state-msg">❌ Error al cargar. Verifica tu conexión.<br>' +
      '<button onclick="loadData()" style="margin-top:12px;padding:8px 20px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">Reintentar</button></div>';
  }
}

loadData();
setInterval(loadData, 60000);

/* ── Modal solicitud centro ── */
function openSolModal() {
  document.getElementById('sol-modal-content').innerHTML = _getSolFormHtml();
  document.getElementById('sol-modal-bd').classList.add('open');
}

function closeSolModal() {
  document.getElementById('sol-modal-bd').classList.remove('open');
}

function _getSolFormHtml() {
  return '<div class="sol-fg"><label>Nombre del centro *</label>' +
    '<input type="text" id="sol-nombre" required placeholder="Escuela Bolivariana, Parque..."></div>' +
    '<div class="sol-fg"><label>Zona</label><select id="sol-zona">' +
    '<option value="">— No especificada —</option>' +
    '<option>Caracas - Libertador</option><option>Caracas - Chacao</option>' +
    '<option>Caracas - Sucre</option><option>Caracas - Baruta</option>' +
    '<option>Vargas</option><option>Miranda</option><option>Otra</option>' +
    '</select></div>' +
    '<div class="sol-fg"><label>Dirección</label>' +
    '<input type="text" id="sol-direccion" placeholder="Av. Principal, Parroquia..."></div>' +
    '<div class="sol-fg"><label>Tu nombre o contacto <span style="font-weight:400;color:#9ca3af;">(opcional)</span></label>' +
    '<input type="text" id="sol-contacto" placeholder="Nombre o número"></div>' +
    '<div class="sol-fg"><label>Notas adicionales <span style="font-weight:400;color:#9ca3af;">(opcional)</span></label>' +
    '<textarea id="sol-notas" placeholder="Cualquier info útil: capacidad, referencia, etc."></textarea></div>' +
    '<div id="sol-error" style="display:none;color:#dc2626;font-size:13px;font-weight:600;margin-bottom:8px;"></div>' +
    '<button class="sol-btn" id="sol-submit-btn" onclick="submitSolicitud()">Enviar solicitud</button>';
}

async function submitSolicitud() {
  var nombre = (document.getElementById('sol-nombre').value || '').trim();
  var errEl = document.getElementById('sol-error');
  errEl.style.display = 'none';
  if (!nombre) {
    errEl.textContent = 'El nombre del centro es obligatorio.';
    errEl.style.display = 'block';
    return;
  }
  var btn = document.getElementById('sol-submit-btn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  var fd = new FormData();
  fd.append('nombre', nombre);
  var zona = document.getElementById('sol-zona').value;
  if (zona) fd.append('zona', zona);
  var dir = (document.getElementById('sol-direccion').value || '').trim();
  if (dir) fd.append('direccion', dir);
  var contacto = (document.getElementById('sol-contacto').value || '').trim();
  if (contacto) fd.append('reportado_por', contacto);
  var notas = (document.getElementById('sol-notas').value || '').trim();
  if (notas) fd.append('notas', notas);
  try {
    var res = await fetch('/api/acopio/solicitar-centro', { method: 'POST', body: fd });
    if (!res.ok) {
      var d = await res.json().catch(function(){return {};});
      throw new Error(d.detail || 'Error del servidor');
    }
    document.getElementById('sol-modal-content').innerHTML =
      '<div class="sol-success">✅ Solicitud enviada.<br>El equipo la revisará pronto.</div>' +
      '<button onclick="closeSolModal()" style="width:100%;padding:10px;background:#f3f4f6;color:#374151;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;">Cerrar</button>';
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Enviar solicitud';
    errEl.textContent = '❌ ' + (e.message || 'Error — verifica tu conexión');
    errEl.style.display = 'block';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSolModal();
});
</script>

<!-- Modal: Reportar centro nuevo -->
<div class="sol-modal-bd" id="sol-modal-bd" onclick="if(event.target===this)closeSolModal()">
  <div class="sol-modal">
    <div class="sol-hdr">
      <div class="sol-title">📍 Reportar centro nuevo</div>
      <button class="sol-x" onclick="closeSolModal()">×</button>
    </div>
    <div id="sol-modal-content"></div>
  </div>
</div>
</body>
</html>
