<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centros de Acopio — Venezuela Rescate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; color: #111;
      min-height: 100dvh;
    }

    /* HEADER */
    .hdr { background: #dc2626; color: white; padding: 16px 20px; }
    .hdr-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
    }
    .hdr-left { display: flex; align-items: center; gap: 12px; }
    .hdr-icon { font-size: 28px; flex-shrink: 0; }
    .hdr-title { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .hdr-sub { font-size: 13px; opacity: .85; margin-top: 2px; }
    .hdr-badge {
      font-size: 12px; padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,.2); font-weight: 600; white-space: nowrap;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: rgba(255,255,255,.8); text-decoration: none;
      font-weight: 600; padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,.15); transition: background .15s;
    }
    .btn-back:hover { background: rgba(255,255,255,.25); }

    /* PILLS */
    .pills-wrap {
      max-width: 1200px; margin: 0 auto;
      padding: 16px 20px 8px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .pill {
      padding: 7px 16px; border: 1.5px solid #d1d5db;
      border-radius: 20px; background: #fff;
      font-size: 13px; font-weight: 600; color: #374151;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .pill:hover { border-color: #dc2626; color: #dc2626; }
    .pill.active { background: #dc2626; color: white; border-color: #dc2626; }

    /* GRID */
    .grid-wrap { max-width: 1200px; margin: 0 auto; padding: 8px 20px 48px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    /* CARD */
    .card {
      background: #fff; border-radius: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      padding: 16px;
      display: flex; flex-direction: column;
    }
    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .card-name { font-size: 15px; font-weight: 700; color: #111; line-height: 1.3; }
    .card-meta { font-size: 12px; color: #9ca3af; margin-top: 3px; }

    .badge {
      flex-shrink: 0; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; white-space: nowrap;
      line-height: 1.4;
    }
    .badge-green  { background: #dcfce7; color: #15803d; }
    .badge-yellow { background: #fefce8; color: #a16207; }
    .badge-red    { background: #fef2f2; color: #dc2626; }
    .badge-gray   { background: #f3f4f6; color: #6b7280; }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 10px 0; }

    .pop-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; flex-wrap: wrap; margin-bottom: 2px;
    }
    .pop-total { font-size: 16px; font-weight: 800; color: #111; }
    .pop-item { color: #6b7280; font-size: 12px; }

    .needs-block { font-size: 13px; }
    .needs-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; margin: 8px 0 3px;
    }
    .needs-label.green { color: #16a34a; }
    .needs-label.red   { color: #dc2626; }
    .needs-txt { color: #374151; line-height: 1.5; word-break: break-word; }
    .needs-none { color: #9ca3af; font-style: italic; font-size: 12px; }

    .no-reporte-msg {
      font-size: 13px; color: #9ca3af; font-style: italic;
      text-align: center; padding: 12px 0;
    }

    .reportes-hoy {
      font-size: 11px; color: #6b7280; margin-top: 6px;
    }

    .btn-report {
      display: block; width: 100%; padding: 11px;
      background: #dc2626; color: white;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; text-align: center;
      text-decoration: none; margin-top: auto; padding-top: 11px;
      transition: background .15s;
      margin-top: 12px;
    }
    .btn-report:hover { background: #b91c1c; }

    /* STATES */
    .state-msg { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; grid-column: 1/-1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb; border-top-color: #dc2626;
      border-radius: 50%; animation: spin .7s linear infinite;
      display: inline-block; margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .hdr-title { font-size: 15px; }
      .hdr-sub { display: none; }
    }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-icon">📦</div>
      <div>
        <div class="hdr-title">Venezuela Rescate · Centros de Acopio</div>
        <div class="hdr-sub">Estado actualizado en tiempo real</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="hdr-badge" id="ultimo-refresh">Cargando...</div>
      <a href="/" class="btn-back">← Inicio</a>
    </div>
  </div>
</header>

<div class="pills-wrap">
  <button class="pill active" data-zona="" onclick="filtrarZona(this)">Todas</button>
  <button class="pill" data-zona="Caracas - Libertador" onclick="filtrarZona(this)">Libertador</button>
  <button class="pill" data-zona="Caracas - Chacao" onclick="filtrarZona(this)">Chacao</button>
  <button class="pill" data-zona="Caracas - Sucre" onclick="filtrarZona(this)">Sucre</button>
  <button class="pill" data-zona="Caracas - Baruta" onclick="filtrarZona(this)">Baruta</button>
  <button class="pill" data-zona="Vargas" onclick="filtrarZona(this)">Vargas</button>
  <button class="pill" data-zona="Miranda" onclick="filtrarZona(this)">Miranda</button>
</div>

<div class="grid-wrap">
  <div id="grid" class="grid">
    <div class="state-msg"><div class="spinner"></div><br>Cargando centros...</div>
  </div>
</div>

<script>
var _data = [];
var _zonaFiltro = '';

function semaforo(ultimoReporte) {
  if (!ultimoReporte) return { cls: 'badge-gray', txt: '⚫ Sin reporte' };
  var diffMin = (Date.now() - new Date(ultimoReporte.created_at).getTime()) / 60000;
  if (diffMin < 120) return { cls: 'badge-green',  txt: '🟢 Hace ' + fmtTiempo(diffMin) };
  if (diffMin < 360) return { cls: 'badge-yellow', txt: '🟡 Hace ' + fmtTiempo(diffMin) };
  return { cls: 'badge-red', txt: '🔴 Hace ' + fmtTiempo(diffMin) };
}

function fmtTiempo(min) {
  if (min < 2) return '1 min';
  if (min < 60) return Math.floor(min) + ' min';
  var h = Math.floor(min / 60);
  var m = Math.floor(min % 60);
  return m > 0 ? h + 'h ' + m + 'min' : h + 'h';
}

function juntarItems(a, b) {
  var items = [];
  if (a) items = items.concat(a.split(',').map(function(s){return s.trim();}).filter(Boolean));
  if (b) items = items.concat(b.split(',').map(function(s){return s.trim();}).filter(Boolean));
  return items;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(item) {
  var c = item.centro;
  var r = item.ultimo_reporte;
  var hoy = item.total_reportes_hoy || 0;
  var sem = semaforo(r);

  var topHtml =
    '<div class="card-top">' +
      '<div>' +
        '<div class="card-name">' + esc(c.nombre) + '</div>' +
        (c.direccion ? '<div class="card-meta">' + esc(c.direccion) + '</div>' : '') +
        (c.zona ? '<div class="card-meta">📍 ' + esc(c.zona) + '</div>' : '') +
      '</div>' +
      '<span class="badge ' + sem.cls + '">' + sem.txt + '</span>' +
    '</div>';

  var bodyHtml = '';
  if (r) {
    var total = (r.hombres||0) + (r.mujeres||0) + (r.ninos||0) + (r.lactantes||0);
    bodyHtml += '<hr class="divider">' +
      '<div class="pop-row">' +
        '<span class="pop-total">👥 ' + total + '</span>' +
        '<span class="pop-item">👨 H:' + (r.hombres||0) + '</span>' +
        '<span class="pop-item">👩 M:' + (r.mujeres||0) + '</span>' +
        '<span class="pop-item">👶 N:' + (r.ninos||0) + '</span>' +
        '<span class="pop-item">🍼 L:' + (r.lactantes||0) + '</span>' +
      '</div>';

    var nec = juntarItems(r.necesitan, r.necesitan_extra);
    var noNec = juntarItems(r.no_necesitan, r.no_necesitan_extra);

    bodyHtml += '<hr class="divider"><div class="needs-block">' +
      '<div class="needs-label green">✅ Necesitan:</div>' +
      '<div class="needs-txt">' + (nec.length ? esc(nec.join(', ')) : '<span class="needs-none">No indicado</span>') + '</div>' +
      '<div class="needs-label red">❌ NO necesitan:</div>' +
      '<div class="needs-txt">' + (noNec.length ? esc(noNec.join(', ')) : '<span class="needs-none">No indicado</span>') + '</div>' +
    '</div>';

    if (hoy > 0) {
      bodyHtml += '<div class="reportes-hoy">📋 ' + hoy + ' reporte' + (hoy === 1 ? '' : 's') + ' hoy</div>';
    }
  } else {
    bodyHtml += '<div class="no-reporte-msg">Sin reporte hoy — toca para actualizar</div>';
  }

  return '<div class="card" data-zona="' + esc(c.zona||'') + '">' +
    topHtml + bodyHtml +
    '<a href="/acopio/reportar/' + c.id + '" class="btn-report">📋 Actualizar reporte</a>' +
  '</div>';
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var items = _data.filter(function(item) {
    if (!_zonaFiltro) return true;
    return (item.centro.zona || '').toLowerCase().indexOf(_zonaFiltro.toLowerCase()) !== -1;
  });
  if (!items.length) {
    grid.innerHTML = '<div class="state-msg">Sin centros en esta zona.</div>';
    return;
  }
  grid.innerHTML = items.map(renderCard).join('');
}

function filtrarZona(btn) {
  document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  _zonaFiltro = btn.dataset.zona;
  renderGrid();
}

async function loadData() {
  try {
    var res = await fetch('/api/acopio/estado');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    _data = await res.json();
    renderGrid();
    var hora = new Date().toLocaleTimeString('es-VE', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Caracas'
    });
    document.getElementById('ultimo-refresh').textContent = '🕐 Actualizado ' + hora;
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div class="state-msg">❌ Error al cargar. Verifica tu conexión.<br>' +
      '<button onclick="loadData()" style="margin-top:12px;padding:8px 20px;background:#dc2626;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">Reintentar</button></div>';
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
